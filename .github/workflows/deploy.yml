name: Deploy Pages
# 仅在 CI 全部通过后部署，且锁定被测试的 SHA（防止部署未经验证的代码）
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 固定到 CI 测试的那个 SHA，而非分支最新
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js sample _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
