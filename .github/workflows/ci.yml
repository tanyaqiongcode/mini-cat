name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: 单元测试与规模基准
        run: npm test
      - name: 安装隔离浏览器
        run: npx playwright install --with-deps chromium
      - name: 浏览器回归（保存、历史 ID、重复修订、搜索乱序）
        run: npm run test:browser
